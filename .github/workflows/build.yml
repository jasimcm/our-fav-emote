# Builds the Windows .exe and the Mac .dmg on real Windows/Mac machines (the bundled ffmpeg and
# AI runtime are platform-specific), after running the app's smoke test on each.
# Run it from the Actions tab, or push a tag like v0.2.0 to also publish a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: release/*.exe
          - os: macos-14
            dist: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # the photo step's AI model (176 MB), downloaded by the smoke test once and cached
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oru-models
          key: u2net-human-seg-01eb6a29

      - name: Smoke test (the real app, including making a character from test media)
        run: npm run smoke -- --creator
        env:
          ORU_MODELS_DIR: ${{ runner.temp }}/oru-models
          ORU_PORTABLE: ${{ matrix.os == 'windows-latest' && '' || '1' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: .smoke/*.png
          include-hidden-files: true

      - run: npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Oru Companion $GITHUB_REF_NAME" --notes "**Windows:** download \`Oru-Companion-Setup-*.exe\` and double-click it (or the \`portable\` .exe to run without installing). **Mac (Apple silicon):** download the \`.dmg\`. See the README for the first-run steps."
